[workspace]
resolver = "2"
members = ["crates/rawcore", "crates/pipeline", "crates/app"]

[workspace.package]
# AUTORITATIVE Versionsnummer — die EINZIGE Stelle. Fenstertitel, --version,
# Fusszeile und die Info.plist des Programmpakets lesen alle von hier.
# (Die Info.plist trug schon einmal still eine andere Nummer als Cargo —
# genau die Drift, die in einem anderen Projekt einen Update-Loop ausloeste.)
version = "2.0.0"
edition = "2021"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
