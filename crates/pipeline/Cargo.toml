[package]
name = "pipeline"
version.workspace = true
edition.workspace = true

[dependencies]
rawcore = { path = "../rawcore" }
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
# Retusche-Modell (ONNX) in reinem Rust — keine native Laufzeit, keine DLL.
tract-onnx = "0.23"
# Panorama: Verzerren, Pyramiden und Paarvergleiche parallel ueber alle Kerne
# (MIT/Apache-2.0, reines Rust; liegt ueber tract ohnehin schon im Baum).
rayon = "1"

