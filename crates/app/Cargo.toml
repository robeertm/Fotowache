[package]
name = "fotowache"
version.workspace = true
edition.workspace = true

[dependencies]
rawcore = { path = "../rawcore" }
pipeline = { path = "../pipeline" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.33"
rfd = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
pollster = "0.4"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# Systemsprache fuer die Wahl Deutsch/Englisch (MIT oder Apache-2.0, auf
# allen drei Zielsystemen ohne weitere Abhaengigkeiten).
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# An die aufrufende Konsole anhaengen (Kommandozeilen-Wege, siehe main.rs).
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
# Programmsymbol in die .exe (siehe build.rs).
embed-resource = "3"
